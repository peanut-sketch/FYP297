name: Forecast and fault check
on:
  schedule: [{cron: "0 19 * * *"}]   # 03:00 Singapore time, daily
  workflow_dispatch:
permissions: {contents: write}
concurrency: forecast
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python twin.py && python forecast.py && python loads.py && python faults.py
      - run: |
          git config user.name "twin-bot"; git config user.email "twin-bot@users.noreply.github.com"
          git add docs/data/*.json
          git diff --cached --quiet || (git commit -m "forecast update" && git push)
